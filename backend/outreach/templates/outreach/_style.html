<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#5d6675; --line:#dfe3ea; --accent:#2f5bd3;
          --ok-bg:#e7f6ec; --ok:#17663a; --bad-bg:#fdecec; --bad:#a32020; --warn-bg:#fff6e0; --warn:#7a5300; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171d; --card:#1d2129; --text:#e7eaf0; --muted:#9aa3b2; --line:#2e3440; --accent:#7d9cf0;
            --ok-bg:#163222; --ok:#8fdcaa; --bad-bg:#3a1a1a; --bad:#f2a3a3; --warn-bg:#3a3018; --warn:#f1d38a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:720px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .muted { color:var(--muted); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-top:16px; }
  label { display:block; font-weight:600; font-size:13px; margin:12px 0 4px; }
  input, textarea { width:100%; font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; }
  textarea { min-height:220px; resize:vertical; }
  pre { white-space:pre-wrap; overflow-wrap:anywhere; margin:0; font:inherit; }
  ul { margin:6px 0 0; padding-left:20px; }
  .note { border-radius:8px; padding:10px 12px; margin-top:16px; }
  .ok { background:var(--ok-bg); color:var(--ok); }
  .bad { background:var(--bad-bg); color:var(--bad); }
  .warn { background:var(--warn-bg); color:var(--warn); }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  button { font:inherit; font-weight:600; border-radius:8px; padding:10px 16px; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--text); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--bad); }
  .meta { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; overflow-wrap:anywhere; }
</style>
