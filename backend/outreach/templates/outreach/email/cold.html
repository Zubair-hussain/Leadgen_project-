<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{ subject }}</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  a { color: {{ brand.red }}; }
  @media (max-width: 520px) {
    .zh-card td { display: block !important; width: 100% !important; }
    .zh-rule { display: none !important; }
    .zh-logo { padding: 0 0 12px 0 !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background:#ffffff;-webkit-text-size-adjust:100%;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;">
  <tr>
    <td style="padding:28px 18px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
        <tr>
          <td style="font-family:'DM Sans',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.65;color:#1b1b1b;">
            {% for paragraph in paragraphs %}<p style="margin:0 0 15px 0;">{{ paragraph }}</p>
            {% endfor %}
          </td>
        </tr>
        {% if signature %}
        <tr>
          <td style="padding:10px 0 0 0;">
            {% include "outreach/email/_signature.html" %}
          </td>
        </tr>
        {% endif %}
        {% if opt_out %}
        <tr>
          <td style="padding:18px 0 0 0;font-family:'DM Sans',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;color:#8a8a8a;">{{ opt_out }}</td>
        </tr>
        {% endif %}
        {% for line in footer_lines %}
        <tr>
          <td style="padding:8px 0 0 0;font-family:'DM Sans',Helvetica,Arial,sans-serif;font-size:11px;line-height:1.5;color:#8a8a8a;">{{ line }}</td>
        </tr>
        {% endfor %}
      </table>
    </td>
  </tr>
</table>
</body>
</html>
