<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <style>
    .bg{fill:#FFFFFF}.side{fill:#F4F6F5;stroke:#D3D9D4;stroke-width:1.5}
    .navi{fill:#EAF1EE;stroke:#0F7F74;stroke-width:1.2;rx:10}
    .nav{fill:#FFFFFF;stroke:#D3D9D4;stroke-width:1;rx:10}
    .ph{fill:#E3E8E4;rx:8}.card{fill:#F8FAF8;stroke:#D3D9D4;stroke-width:1.2;rx:12}
    .h{fill:#101815;font-weight:700}.t{fill:#3C433E;font-size:13px}.s{fill:#8A938C;font-size:11.5px}
    .cap{fill:#6B7872;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
    .badge{fill:#0F7F74}
  </style>
  <rect class="bg" width="900" height="560"/>
  <rect x="0" y="0" width="900" height="46" fill="#F4F6F5"/>
  <text class="cap" x="24" y="29">Wireframe — Dashboard shell  ( /dashboard )</text>

  <!-- sidebar -->
  <rect class="side" x="0" y="46" width="240" height="514"/>
  <text class="h" x="24" y="90" font-size="16">◆ LeadFlow</text>
  <text class="s" x="24" y="108">Xovato Digital</text>
  <text class="cap" x="24" y="140" font-size="10">Main</text>
  <rect class="navi" x="16" y="150" width="208" height="40"/>
  <text class="t" x="32" y="175">⚡ Generator</text>
  <rect class="nav" x="16" y="196" width="208" height="40"/>
  <text class="t" x="32" y="221">▤ Leads Hub</text>
  <rect class="badge" x="188" y="205" width="24" height="20" rx="10"/>
  <text x="200" y="220" fill="#fff" font-size="11" text-anchor="middle">N</text>
  <rect class="nav" x="16" y="242" width="208" height="40"/>
  <text class="t" x="32" y="267">🛡 Verifier</text>
  <rect class="nav" x="16" y="288" width="208" height="40"/>
  <text class="t" x="32" y="313">✉ Sender</text>
  <text class="cap" x="24" y="352" font-size="10">Analytics</text>
  <rect class="nav" x="16" y="362" width="208" height="30"/>
  <rect class="nav" x="16" y="398" width="208" height="30"/>
  <!-- footer -->
  <rect class="nav" x="16" y="470" width="208" height="34"/>
  <text class="t" x="32" y="491">☾ Dark Mode           ◯</text>
  <rect class="nav" x="16" y="512" width="208" height="34"/>
  <text class="t" x="32" y="533" fill="#B13A3A">⎋ Sign Out</text>

  <!-- main -->
  <text class="cap" x="272" y="82" font-size="11">Extraction Engine</text>
  <text class="h" x="272" y="112" font-size="26">Lead Generator</text>
  <rect class="ph" x="272" y="126" width="380" height="12"/>

  <rect class="card" x="272" y="160" width="596" height="360"/>
  <text class="s" x="292" y="190">Active tab content renders here (Generator / Leads Hub / Verifier / Sender)</text>
  <rect class="ph" x="292" y="210" width="556" height="36" rx="8"/>
  <rect class="ph" x="292" y="258" width="270" height="120" rx="8"/>
  <rect class="ph" x="578" y="258" width="270" height="120" rx="8"/>
  <rect class="ph" x="292" y="392" width="556" height="108" rx="8"/>

  <!-- top-right connection status -->
  <rect x="770" y="58" width="98" height="26" rx="13" fill="#E7F3EA" stroke="#147D52"/>
  <circle cx="786" cy="71" r="4" fill="#147D52"/>
  <text class="s" x="796" y="75" fill="#147D52">Connected</text>
</svg>
