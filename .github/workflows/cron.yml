name: Outreach scheduler
# Vercel has no background workers, so this calls the backend on a timer (free for public repos).
# Repo secrets needed: BACKEND_URL (https://your-backend.vercel.app) and CRON_SECRET.
#  - every 5 minutes: send due emails, batch drafts, read replies, Sunday report (when due)
#  - every 30 minutes: autopilot (find leads once a day, otherwise draft a couple of emails)
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: outreach-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Secrets not set yet, skipping."; exit 0; fi
          curl --fail-with-body --silent --show-error --max-time 90 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "$BACKEND_URL/api/outreach/cron/tick/"
          # Autopilot on minutes 0-4 and 30-34 of each hour (GitHub may delay a run by a few minutes).
          minute=$(date -u +%M)
          if [ $((10#$minute % 30)) -lt 5 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            curl --fail-with-body --silent --show-error --max-time 90 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" "$BACKEND_URL/api/outreach/cron/autopilot/"
          fi
