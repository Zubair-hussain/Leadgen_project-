name: Weekly security scan

# Runs every Monday 06:00 UTC (and on demand). Audits Python + npm dependencies
# and scans for committed secrets. If anything is found, it opens (or updates) a
# GitHub issue so you get a notification.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Dependency & secret audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python dependency audit (pip-audit)
        id: pip_audit
        continue-on-error: true
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r backend/requirements.txt

      - name: Frontend dependency audit (npm)
        id: npm_audit
        continue-on-error: true
        working-directory: leadgen-frontend
        run: npm audit --audit-level=high

      - name: Secret scan (gitleaks)
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open an issue if anything was found
        if: >-
          steps.pip_audit.outcome == 'failure' ||
          steps.npm_audit.outcome == 'failure' ||
          steps.gitleaks.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const parts = [
              `**Automated weekly security scan found issues.**`,
              ``,
              `| Check | Result |`,
              `| --- | --- |`,
              `| pip-audit (Python) | ${{ steps.pip_audit.outcome }} |`,
              `| npm audit (frontend) | ${{ steps.npm_audit.outcome }} |`,
              `| gitleaks (secrets) | ${{ steps.gitleaks.outcome }} |`,
              ``,
              `See the run for details: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const title = 'Weekly security scan: action required';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'security',
            });
            const found = existing.data.find(i => i.title === title);
            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: found.number, body: parts,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body: parts, labels: ['security'],
              });
            }
