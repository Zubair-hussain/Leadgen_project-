name: Deploy landing page (Vercel)

# Deploys the static landing page (leadgen.html) to Vercel.
# Requires three repository secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# If they are not set, the job skips cleanly (e.g. when using Vercel's native
# Git integration instead of this workflow).

on:
  push:
    branches: [main]
    paths:
      - 'leadgen.html'
      - 'vercel.json'
      - '.vercelignore'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Vercel production deploy
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Notify if secrets are missing
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: |
          echo "VERCEL_TOKEN is not configured — skipping deploy."
          echo "Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID as repo secrets to enable it."

      - uses: actions/checkout@v4
        if: ${{ env.VERCEL_TOKEN != '' }}

      - uses: actions/setup-node@v4
        if: ${{ env.VERCEL_TOKEN != '' }}
        with:
          node-version: '20'

      - name: Install Vercel CLI
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy to production
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"

      # Records a GitHub Deployment so the deploy shows in the repo's
      # "Deployments" / Environments UI with a green success status.
      - name: Record GitHub deployment
        if: ${{ env.VERCEL_TOKEN != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const dep = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              required_contexts: [],
              auto_merge: false,
              description: 'Vercel landing page deploy',
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: dep.data.id,
              state: 'success',
              environment: 'production',
              description: 'Deployed to Vercel',
            });
