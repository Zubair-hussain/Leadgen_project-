#cloud-config
# Oracle Cloud Always Free (Ampere A1, 12 GB RAM, Oracle Linux 8/9, aarch64).
# Paste into: Create instance -> Advanced options -> Cloud-init script.
# Secrets (backend/.env) are NOT set here; add them over SSH afterwards.

package_update: true
package_upgrade: true

packages:
  - curl
  - wget
  - git
  - nginx
  - firewalld
  - python3
  - python3-pip
  - openssl
  - tar
  - unzip
  - policycoreutils-python-utils

write_files:
  # Reverse proxy. Replace app.example.com with your domain, then run certbot (see bottom).
  - path: /etc/nginx/conf.d/leadgen.conf
    permissions: '0644'
    content: |
      server_tokens off;
      limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

      server {
          listen 80;
          server_name app.example.com;

          add_header X-Content-Type-Options nosniff always;
          add_header X-Frame-Options DENY always;
          add_header Referrer-Policy same-origin always;

          location ~ /\. { return 404; }
          location ~* \.map$ { return 404; }

          # API and Django admin -> backend container (bound to localhost only)
          location ~ ^/(api|static)/ {
              limit_req zone=api burst=20 nodelay;
              proxy_pass http://127.0.0.1:8000;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 180s;
          }

          # Dashboard (static export) -> frontend container on 127.0.0.1:8080
          location / {
              proxy_pass http://127.0.0.1:8080;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }

runcmd:
  # Firewall (also open TCP 80 and 443 in the OCI Security List; never 5432, 6379 or 8000)
  - systemctl enable --now firewalld
  - firewall-cmd --permanent --add-service=ssh
  - firewall-cmd --permanent --add-service=http
  - firewall-cmd --permanent --add-service=https
  - firewall-cmd --reload

  # SELinux: let nginx proxy to the Docker containers on localhost
  - setsebool -P httpd_can_network_connect 1

  # Docker (Docker's CentOS repo works on Oracle Linux; --allowerasing resolves podman conflicts)
  - dnf install -y dnf-plugins-core
  - dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
  - dnf install -y --allowerasing docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - usermod -aG docker opc

  # nginx (config written above)
  - nginx -t && systemctl enable --now nginx

  # HTTPS client (EPEL name depends on the Oracle Linux version; failures here are not fatal)
  - dnf install -y oracle-epel-release-el9 || dnf install -y oracle-epel-release-el8 || true
  - dnf install -y certbot python3-certbot-nginx || true

  # Application directory
  - mkdir -p /opt/leadgen
  - chown opc:opc /opt/leadgen
  - chmod 755 /opt/leadgen

  # Setup completion marker
  - touch /opt/leadgen/cloud-init-complete

# After the VM boots (SSH in as opc):
#   cd /opt/leadgen && git clone <your repo> . && nano backend/.env
#   docker compose up -d --build
#   sudo certbot --nginx -d app.example.com
